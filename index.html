<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>reeggtag — bio</title>
  <style>
    /* Подключаем пиксельный шрифт для никнейма */
    @import url('https://googleapis.com');

    /* 1. Сброс базовых отступов */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* 2. Твой собственный фон с защитой от белых полос на мобилках */
    body {
      margin: 0;
      width: 100vw;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #121316; /* Убирает белую область снизу экрана */
      background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('bg.jpg');
      background-repeat: no-repeat;
      background-position: center center;
      background-attachment: fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      overflow-x: hidden;
      color: #eeeeee;
    }

    /* 3. Карточка (с сохранением легкой прозрачности) */
    .main-container {
      background: rgba(21, 23, 27, 0.82); 
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 28px;
      width: 100%;
      max-width: 440px;
      padding: 35px 30px;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* 4. Блок профиля */
    .profile-header {
      text-align: center;
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      margin: 0 auto 16px auto;
      border: 2px solid rgba(255, 255, 255, 0.08);
      object-fit: cover;
      display: block;
    }

    .nickname {
      font-family: 'Press Start 2P', cursive;
      font-size: 16px;
      margin-bottom: 16px;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .description {
      font-size: 14px;
      color: #aaaaaa;
      line-height: 1.6;
      font-weight: 400;
      padding: 0 10px;
    }

    /* Тонкий нейтральный серый разделитель */
    .divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.06);
      width: 100%;
    }

    /* 5. Кнопки социальных сетей */
    .links-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-item {
      width: 100%;
      height: 54px;
      background: rgba(255, 255, 255, 0.01);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 14px;
      display: flex;
      align-items: center;
      padding: 0 18px;
      color: #ffffff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .link-item:hover {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.12);
      transform: translateY(-1px);
    }

    .link-item.noclick {
      cursor: default;
    }
    .link-item.noclick:hover {
      transform: none;
    }

    .icon-tag {
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 1px;
      color: #555555;
      width: 45px;
      margin-right: 10px;
    }

    .link-value {
      color: #dddddd;
    }

    /* 6. ТГ-плеер в самом низу карточки */
    .tg-audio-player {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.01);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 14px;
      padding: 12px 18px;
      gap: 14px;
    }

    /* Кнопка Play в один тон с остальным дизайном */
    .tg-play-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #ffffff;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .tg-play-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.15);
    }

    /* Звуковая дорожка растянута до конца */
    .tg-wave {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-grow: 1;
      height: 24px;
    }

    /* Полоски в цвет текста визитки */
    .tg-bar {
      width: 3px;
      background: #dddddd; 
      border-radius: 2px;
      opacity: 0.8;
    }

    /* Разная высота полосок для правильного эффекта аудио */
    .tg-bar:nth-child(odd) { height: 10px; }
    .tg-bar:nth-child(even) { height: 18px; }
    .tg-bar:nth-child(3n) { height: 14px; }
    .tg-bar:nth-child(5n) { height: 22px; }

    /* Эффект блеклости полосок, только когда плеер на паузе вручную */
    .tg-audio-player.paused-manually .tg-bar {
      background: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>

  <!-- Главный контейнер -->
  <div class="main-container">
    
    <!-- Секция профиля -->
    <div class="profile-header">
      <img class="avatar" src="avatar.jpg" alt="reeggtag Avatar">
      <div class="nickname">reeggtag</div>
      <div class="description">
        Пр, я рыг. Мне 14 лет. Я люблю игры жанра топ-даун, инди-игры, рпг и песочницы. В тикитоке у меня целых 1к падпищикаф и я крутой. Ещё мне не с кем гулять, и я сижу дома и играю в кампутеррр
      </div>
    </div>

    <div class="divider"></div>

    <!-- Сетка твоих социальных сетей -->
    <div class="links-grid">
      
      <!-- Telegram -->
      <a href="https://t.me" target="_blank" class="link-item">
        <span class="icon-tag">TG</span>
        <span class="link-value">@reeggtag15</span>
      </a>
      
      <!-- Discord -->
      <div class="link-item noclick">
        <span class="icon-tag">DS</span>
        <span class="link-value">reeggtag</span>
      </div>
      
      <!-- TikTok -->
      <a href="https://tiktok.com" target="_blank" class="link-item">
        <span class="icon-tag">TT</span>
        <span class="link-value">@reeggtag</span>
      </a>

    </div>

    <!-- Тонкий разделитель перед плеером -->
    <div class="divider"></div>

    <!-- ТГ-плеер в самом низу -->
    <div id="tg-player" class="tg-audio-player">
      <button id="music-toggle" class="tg-play-btn" aria-label="Воспроизведение">
        <span id="music-icon">▶</span>
      </button>
      <div class="tg-wave">
        <!-- Увеличенное количество полосок для заполнения всей длины -->
        <div class="tg-bar"></div><div class="tg-bar"></div><div class="tg-bar"></div><div class="tg-bar"></div><div class="tg-bar"></div>
        <div class="tg-bar"></div><div class="tg-bar"></div><div class="tg-bar"></div><div class="tg-bar"></div><div class="tg-bar"></div>
        <div class="tg-bar"></div><div class="tg-bar"></div><div class="tg-bar"></div><div class="tg-bar"></div><div class="tg-bar"></div>
        <div class="tg-bar"></div><div class="tg-bar"></div><div class="tg-bar"></div><div class="tg-bar"></div><div class="tg-bar"></div>
        <div class="tg-bar"></div><div class="tg-bar"></div><div class="tg-bar"></div><div class="tg-bar"></div><div class="tg-bar"></div>
        <div class="tg-bar"></div><div class="tg-bar"></div><div class="tg-bar"></div><div class="tg-bar"></div><div class="tg-bar"></div>
      </div>
    </div>

  </div>

  <!-- Аудиоплеер (музыка на повторе) -->
  <audio id="bg-music" src="music.mp3" loop></audio>

  <!-- Скрипт автозапуска и управления кнопкой -->
  <script>
    const music = document.getElementById('bg-music');
    const toggleBtn = document.getElementById('music-toggle');
    const icon = document.getElementById('music-icon');
    const playerBlock = document.getElementById('tg-player');

    // Уровень громкости (20%)
    music.volume = 0.2; 

    function togglePlay() {
      if (music.paused) {
        music.play().then(() => {
          icon.textContent = '⏸';
          playerBlock.classList.remove('paused-manually');
        }).catch(err => console.log("Ошибка звука:", err));
      } else {
        music.pause();
        icon.textContent = '▶';
        playerBlock.classList.add('paused-manually');
      }
    }

    toggleBtn.addEventListener('click', (e) => {
      e.stopPropagation(); 
      togglePlay();
    });

    function autoPlay() {
      if (music.paused) {
        music.play().then(() => {
          icon.textContent = '⏸';
          playerBlock.classList.remove('paused-manually');
          removeListeners();
        }).catch(() => {});
      }
    }

    function addListeners() {
      window.addEventListener('click', autoPlay);
      window.addEventListener('scroll', autoPlay);
      window.addEventListener('keydown', autoPlay);
      window.addEventListener('touchstart', autoPlay);
    }

    function removeListeners() {
      window.removeEventListener('click', autoPlay);
      window.removeEventListener('scroll', autoPlay);
      window.removeEventListener('keydown', autoPlay);
      window.removeEventListener('touchstart', autoPlay);
    }

    addListeners();
  </script>

</body>
</html>
